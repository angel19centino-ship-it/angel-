name: Deploy to GitHub Pages

# Publishes index.html to the gh-pages branch, which GitHub Pages serves.
# (The artifact-based Pages flow needs a token that can create the Pages
# site; the default GITHUB_TOKEN cannot, so we deploy the classic way.)

on:
  push:
    branches: [claude/premium-landing-page-pwm0v9, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish index.html to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/site
          cp index.html /tmp/site/
          cp -r supremacy /tmp/site/
          cp -r snake /tmp/site/
          cp -r sweep /tmp/site/
          cp -r vigil /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
